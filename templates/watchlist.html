<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Watchlist - Cineverse</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- NAVBAR -->
   <nav>
    <div class="nav-links">
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('watchlist') }}">Watchlist</a>
        <a href="{{ url_for('completed') }}">Completed</a>
    </div>
</nav>


    <!-- WATCHLIST -->
    <section class="watchlist-section">

        <h1>My Watchlist</h1>

        {% if movies %}

        <div class="watchlist-grid">

            {% for movie in movies %}

            <div class="watchlist-item">

                <!-- POSTER -->
                <img
                    src="https://image.tmdb.org/t/p/w500{{ movie['poster_path'] }}"
                    alt="{{ movie['title'] }}"
                    class="watchlist-poster"
                >

                <!-- TITLE -->
                <h2>{{ movie["title"] }}</h2>

                <!-- VIEW DETAILS -->
                <a
                    href="{{ url_for('movie', movie_id=movie['movie_id']) }}"
                    class="watchlist-details-btn">
                    View Details
                </a>

                <!-- REMOVE -->
                <a
                    href="{{ url_for('remove_from_watchlist', movie_id=movie['movie_id']) }}"
                    class="watchlist-remove-btn">
                    Remove
                </a>

            </div>

            {% endfor %}

        </div>

        {% else %}

        <!-- EMPTY WATCHLIST -->

        <div class="empty-watchlist">

            <h2>Your Watchlist is Empty</h2>

            <p>
                Add movies and series that you want to watch later.
            </p>

            <a href="{{ url_for('home') }}">
                Explore Cineverse
            </a>

        </div>

        {% endif %}

    </section>

</body>
</html>
